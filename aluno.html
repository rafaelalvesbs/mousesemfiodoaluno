<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Controle Remoto</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
            font-family: sans-serif;
            user-select: none;
        }
        header { padding: 15px; font-size: 18px; font-weight: bold; text-align: center; }
        
        /* Área de arrasto original */
        #trackpad {
            width: 90%;
            height: 40vh;
            margin-bottom: 20px;
            background: #2a2a2a;
            border: 2px dashed #555;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 1.2rem;
            transition: background 0.2s;
        }
        #trackpad.active { background: #444; }

        /* Controles Direcionais */
        .dpad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .dpad-row {
            display: flex;
            gap: 60px; /* Espaço no meio entre esquerda e direita */
        }
        .dpad-btn {
            background: #333;
            border: 2px solid #555;
            color: white;
            font-size: 24px;
            width: 60px;
            height: 60px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dpad-btn:active {
            background: #ff3b30;
            border-color: #ff3b30;
        }
    </style>
</head>
<body>
    <header>Mouse Remoto</header>
    
    <div id="trackpad">Arraste aqui ou use as setas</div>

    <!-- Setas Direcionais -->
    <div class="dpad">
        <div class="dpad-btn" id="btn-up">⬆️</div>
        <div class="dpad-row">
            <div class="dpad-btn" id="btn-left">⬅️</div>
            <div class="dpad-btn" id="btn-right">➡️</div>
        </div>
        <div class="dpad-btn" id="btn-down">⬇️</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // VERIFIQUE SE O DATABASEURL ESTÁ EXATAMENTE IGUAL AO DO SEU PAINEL
        const firebaseConfig = {
            apiKey: "AIzaSyBKW1CdBkPJFOOWT_qoDIcfYoXEidJ6PJM",
            authDomain: "mouse-sem-fio.firebaseapp.com",
            databaseURL: "https://mouse-sem-fio-default-rtdb.firebaseio.com",
            projectId: "mouse-sem-fio",
            storageBucket: "mouse-sem-fio.firebasestorage.app",
            messagingSenderId: "539536111005",
            appId: "1:539536111005:web:af6c15c406af5e5e34eb74",
            measurementId: "G-WX2J4Q4J1M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        const trackpad = document.getElementById('trackpad');

        if (!roomId) {
            trackpad.innerText = "Erro: ID da sala não encontrado.";
            trackpad.style.color = "#ff3b30";
        } else {
            // --- Lógica do Trackpad (Arrasto e Clique Rápido) ---
            let lastX = 0, lastY = 0, startX = 0, startY = 0, touchStartTime = 0;

            trackpad.addEventListener('touchstart', (e) => {
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
                startX = lastX;
                startY = lastY;
                touchStartTime = Date.now(); 
            });

            trackpad.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const dx = currentX - lastX;
                const dy = currentY - lastY;

                set(ref(db, `salas/${roomId}/mouse`), { dx, dy, updateId: Date.now(), click: false });

                lastX = currentX;
                lastY = currentY;
            }, { passive: false });

            trackpad.addEventListener('touchend', (e) => {
                const touchDuration = Date.now() - touchStartTime;
                const moveDistX = Math.abs(lastX - startX);
                const moveDistY = Math.abs(lastY - startY);

                if (touchDuration < 200 && moveDistX < 10 && moveDistY < 10) {
                    trackpad.classList.add('active');
                    setTimeout(() => trackpad.classList.remove('active'), 150);
                    set(ref(db, `salas/${roomId}/mouse`), { dx: 0, dy: 0, updateId: Date.now(), click: true });
                }
            });

            // --- Lógica das Setas Direcionais ---
            let moveInterval = null;
            const speed = 15; // Ajuste a velocidade das setas aqui

            function startMoving(dx, dy) {
                // Envia as coordenadas repetidamente enquanto o botão estiver pressionado
                moveInterval = setInterval(() => {
                    set(ref(db, `salas/${roomId}/mouse`), { dx, dy, updateId: Date.now(), click: false });
                }, 50); // A cada 50 milissegundos
            }

            function stopMoving() {
                clearInterval(moveInterval);
            }

            // Mapeando cada botão para sua direção
            const btnUp = document.getElementById('btn-up');
            const btnDown = document.getElementById('btn-down');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            // Cima
            btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving(0, -speed); });
            btnUp.addEventListener('touchend', stopMoving);
            
            // Baixo
            btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving(0, speed); });
            btnDown.addEventListener('touchend', stopMoving);
            
            // Esquerda
            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving(-speed, 0); });
            btnLeft.addEventListener('touchend', stopMoving);
            
            // Direita
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); startMoving(speed, 0); });
            btnRight.addEventListener('touchend', stopMoving);
        }
    </script>
</body>
</html>
